[project]
name = "coaching"
version = "0.1.0"
description = "Coach-supervised powerlifting training journal with curated athlete memory and a local MCP server"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "mcp>=1.9,<2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "coverage>=7.6",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# Pyflakes/pycodestyle errors, bugbear, import order, Django-specific checks, simplifications.
select = ["E", "F", "W", "B", "I", "DJ", "UP", "SIM"]
# Line length is not enforced: the codebase uses dense lines; lint focuses on likely bugs.
ignore = ["DJ001", "E501"]

[tool.coverage.run]
branch = true
source = ["coaching", "training", "memory"]
# The concurrency check is a manual multi-process script, not part of the unit test run.
omit = ["*/migrations/*", "ops/concurrency_check.py", "manage.py", "coaching/asgi.py", "coaching/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
